<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Left Flank Strategies</title>
  <!--
    "LF" in the brand face: Helvetica Neue Black (--font-sans, weight 900).
    Drawn as paths, not <text>, so the letterforms are identical on every
    platform — Helvetica Neue does not exist on Windows/Linux and a
    font-family reference would silently substitute different shapes.
    Cap height 44 (y 10-54), stem 10, tracked tight to match the wordmark.
  -->
  <rect width="64" height="64" fill="#000000"/>
  <g fill="#FFFFFF">
    <!-- L -->
    <rect x="4"  y="10" width="10" height="44"/>
    <rect x="4"  y="44" width="27" height="10"/>
    <!-- F -->
    <rect x="33" y="10" width="10" height="44"/>
    <rect x="33" y="10" width="27" height="10"/>
    <rect x="33" y="27" width="22" height="9"/>
  </g>
</svg>
